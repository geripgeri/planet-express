name: Secret Scanning
on:
  pull_request:
  push:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *" # run once a day at 4 AM

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        # Using the official Docker action allows the runner to handle Node.js steps
        # while still using the specific Gitleaks environment for the scan.
        # Pinned to match the gitleaks version used by the mirror workflow.
        uses: docker://zricethezav/gitleaks:v8.30.1
        with:
          args: detect --source=. --verbose --redact
