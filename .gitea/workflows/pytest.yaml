name: Python CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "latest"
          # Enable caching of the uv cache
          enable-cache: true
          # Cache the managed CPython install; without this every job
          # re-downloads ~34 MiB from releases.astral.sh
          cache-python: true
          # releases.astral.sh is slow on this runner's network (~230 KB/s);
          # fetch uv itself from GitHub Releases instead
          download-from-astral-mirror: false

      - name: Set up Python
        run: uv python install 3.14


      - name: Install dependencies
        run: |
          uv sync --all-extras --dev

      - name: Run tests with pytest
        run: |
          uv run pytest --cov=./ --cov-report=xml:coverage.xml --cov-report=term-missing --junitxml=pytest.xml

      - name: Pytest coverage comment
        if: github.event_name == 'pull_request'
        uses: MishaKav/pytest-coverage-comment@v1.11.1
        with:
          pytest-xml-coverage-path: ./coverage.xml
          junitxml-path: ./pytest.xml
