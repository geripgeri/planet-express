name: Python Security Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read

jobs:
  audit:
    name: uv audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          # Pinned: `uv audit` only exists from 0.10.12 on. "latest" is a
          # moving target and briefly broke when uv 0.9.x hid the command.
          version: "0.12.5"
          # Enable caching of the uv cache
          enable-cache: true
          # Cache the managed CPython install; without this every job
          # re-downloads ~34 MiB from releases.astral.sh
          cache-python: true
          # releases.astral.sh is slow on this runner's network (~230 KB/s);
          # fetch uv itself from GitHub Releases instead
          download-from-astral-mirror: false

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run security audit
        # --preview-features audit silences the experimental warning.
        # uv audit exits non-zero if any vulnerability is found,
        # which is what fails this job.
        run: uv audit --preview-features audit
