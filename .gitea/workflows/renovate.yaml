name: Renovate

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Run Renovate Docker image
        uses: docker://renovate/renovate:44
        env:
          # Token stored in repository secrets; must have permissions:
          # write:issue
          # write:repository
          # read:user
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
          RENOVATE_USERNAME: renovate-bot
          RENOVATE_PLATFORM: gitea
          RENOVATE_ENDPOINT: ${{ github.server_url }}/api/v1
          RENOVATE_REPOSITORIES: '["${{ github.repository }}"]'
          RENOVATE_LOG_LEVEL: info
          # Fine-grained personal access token, read only access to all public repositories
          # More: https://github.com/renovatebot/renovate/blob/main/docs/usage/getting-started/running.md#githubcom-token-for-changelogs-and-tools
          RENOVATE_GITHUB_COM_TOKEN: ${{ secrets.RENOVATE_GITHUB_COM_TOKEN }}
