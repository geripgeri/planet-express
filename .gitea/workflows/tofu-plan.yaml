name: Tofu Plan

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'infrastructure/**'
      - '.gitea/workflows/tofu-plan.yaml'

concurrency:
  group: tofu-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: v1.12.6

      - name: Set up terragrunt
        run: |
          set -euo pipefail
          curl -sfL \
            https://github.com/gruntwork-io/terragrunt/releases/download/v1.1.2/terragrunt_linux_amd64 \
            -o /usr/local/bin/terragrunt
          chmod +x /usr/local/bin/terragrunt

      - name: Set up sops
        run: |
          set -euo pipefail
          curl -sfL \
            https://github.com/getsops/sops/releases/download/v3.13.3/sops-v3.13.3.linux.amd64 \
            -o /usr/local/bin/sops
          chmod +x /usr/local/bin/sops

      - name: Set up jq
        run: |
          set -euo pipefail
          curl -sfL \
            https://github.com/jqlang/jq/releases/download/jq-1.7.1/jq-linux-amd64 \
            -o /usr/local/bin/jq
          chmod +x /usr/local/bin/jq

      - name: Stage the runner age key
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          set -euo pipefail
          install -m 600 /dev/null /tmp/runner.agekey
          printf '%s\n' "$SOPS_AGE_KEY" > /tmp/runner.agekey

      - name: Plan stacks
        env:
          SOPS_AGE_KEY_FILE: /tmp/runner.agekey
          KUBECONFIG: ${{ secrets.KUBECONFIG }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [ -n "${KUBECONFIG:-}" ]; then
            mkdir -p "$HOME/.kube"
            printf '%s' "$KUBECONFIG" | base64 -d > "$HOME/.kube/config"
            chmod 600 "$HOME/.kube/config"
          fi

          stacks=$(find infrastructure/stacks -name terragrunt.stack.hcl -exec grep -qE '^[[:space:]]*(unit|stack)[[:space:]]+"' {} \; -exec dirname {} \; | sort -u)
          echo "Found stacks:"
          echo "$stacks"
          printf '%s\n' "$stacks" > "$GITHUB_WORKSPACE/stacks.txt"
          fail=0
          : > "$GITHUB_WORKSPACE/failed-stacks.txt"
          authentik_provider_ready() {
            sops --decrypt --extract '["authentik"]["url"]' \
              infrastructure/secrets.yaml >/dev/null 2>&1 &&
              sops --decrypt --extract '["authentik"]["api_token"]' \
                infrastructure/secrets.yaml >/dev/null 2>&1
          }
          while IFS= read -r stack; do
            if [[ "$stack" == "infrastructure/stacks/private/authentik" ]] &&
              ! authentik_provider_ready; then
              echo "::notice::Skipping $stack until Authentik URL and API token exist"
              continue
            fi
            echo "::group::Plan $stack"
            name="$(basename "$stack")"
            cd "$GITHUB_WORKSPACE/$stack"
            rc=0
            terragrunt stack run plan --out-dir "$GITHUB_WORKSPACE/plans/$name" --log-level info \
              -- -detailed-exitcode \
              > "$GITHUB_WORKSPACE/plan-$name.log" 2>&1 \
              || rc=$?
            printf '%s\n' "$rc" > "$GITHUB_WORKSPACE/plan-exit-$name.txt"
            if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then
              fail=1
              printf '%s\n' "$name" >> "$GITHUB_WORKSPACE/failed-stacks.txt"
            fi
            cat "$GITHUB_WORKSPACE/plan-$name.log"
            echo "::endgroup::"
            cd "$GITHUB_WORKSPACE"
          done <<< "$stacks"
          exit $fail

      - name: Archive plan binaries
        if: ${{ always() }}
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          fail=0
          for d in plans/*/; do
            [ -d "$d" ] || continue
            name="$(basename "$d")"
            tar -czf "tofu-plans-$name.tar.gz" -C plans "$name" || fail=1
          done
          printf '%s\n' "$PR_HEAD_SHA" > plan-shas.txt
          exit $fail

      - name: Upload plan logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v3
        with:
          name: tofu-plans
          path: |
            plan-*.log
            stacks.txt
            failed-stacks.txt
            plan-shas.txt
            tofu-plans-*.tar.gz

      - name: Post plan comments
        if: ${{ always() }}
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          PR_NUM: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          [ -f stacks.txt ] || exit 0
          fail=0
          while IFS= read -r stack; do
            name="$(basename "$stack")"
            log="$GITHUB_WORKSPACE/plan-$name.log"
            [ -f "$log" ] || continue
            echo "::group::Comment $name"
            rc=1
            if [ -f "$GITHUB_WORKSPACE/plan-exit-$name.txt" ]; then
              rc="$(cat "$GITHUB_WORKSPACE/plan-exit-$name.txt")"
            fi
            summary="Tofu plan: $name"
            body_file="$GITHUB_WORKSPACE/comment-$name.md"
            if grep -qx "$name" "$GITHUB_WORKSPACE/failed-stacks.txt" 2>/dev/null; then
              summary="Tofu plan FAILED: $name"
              rc=1
            fi
            if [ "$rc" -eq 0 ]; then
              {
                printf '✅ Tofu plan: %s — stack is up to date.\n\n' "$name"
                printf '%s\n' "<!-- tofu-plan:$name -->"
              } > "$body_file"
            else
              if [ "$rc" -ne 1 ] && [ "$rc" -ne 2 ]; then
                summary="Tofu plan FAILED: $name (exit $rc)"
              fi
              diff_file="$GITHUB_WORKSPACE/body-$name.txt"
              sed -E \
                -e 's/\x1b\[[0-9;]*m//g' \
                -e 's/^.*tofu: //' \
                "$log" \
                | awk '
                  /^╷$/ { buf = $0; inbuf = 1; next }
                  inbuf {
                    if ($0 == "╵") {
                      buf = buf "\n" $0
                      if (buf !~ /Additional provider information/) print buf
                      inbuf = 0; buf = ""
                      next
                    }
                    if ($0 ~ /^[│]/ || $0 == "") {
                      buf = buf "\n" $0
                      next
                    }
                    if (buf !~ /Additional provider information/) print buf
                    inbuf = 0; buf = ""
                  }
                  { print }
                  END {
                    if (inbuf && buf !~ /Additional provider information/) print buf
                  }
                ' \
                | sed -E \
                  -e '/^[[:space:]]*- Reusing previous version/d' \
                  -e '/^[[:space:]]*- Installing /d' \
                  -e '/^[[:space:]]*- Installed /d' \
                  -e '/^[[:space:]]*- Using .* from the shared cache/d' \
                  -e '/^[[:space:]]*- Detected previously-installed/d' \
                  -e '/^[[:space:]]*- Waiting for lock on cache directory/d' \
                  -e '/^[[:space:]]*- terraform\.io\/builtin/d' \
                  -e 's/^[[:space:]]*([+-])/\1/' \
                | grep -E '^[+-] |^[[:space:]]*~ |^[[:space:]]*# |^Plan:|^No changes|^(Error|╷|│|╵)' \
                > "$diff_file" || true
              if [ "$(wc -c < "$diff_file")" -gt 30000 ]; then
                head -c 30000 "$diff_file" > "$diff_file.cap"
                mv "$diff_file.cap" "$diff_file"
                printf '\n-- truncated at 30000 chars; full log in Tofu plan artifact --\n' >> "$diff_file"
              fi
              {
                printf '<details>\n<summary><b>%s</b></summary>\n\n' "$summary"
                printf '```diff\n'
                cat "$diff_file"
                printf '\n```\n\n'
                printf '%s\n' "<!-- tofu-plan:$name -->"
                printf '%s\n' '</details>'
              } > "$body_file"
              rm -f "$diff_file"
            fi
            comments_url="$SERVER_URL/api/v1/repos/$REPO/issues/$PR_NUM/comments"
            existing_id=$(curl -fsSL -H "Authorization: token $GITEA_TOKEN" "$comments_url" | \
              jq -r --arg m "tofu-plan:$name" '.[] | select(.body | contains($m)) | .id' | head -1)
            payload=$(jq -nc --rawfile b "$body_file" '{body:$b}')
            if [ -n "$existing_id" ]; then
              curl -fsSL -X PATCH -H "Authorization: token $GITEA_TOKEN" \
                -H "Content-Type: application/json" -d "$payload" \
                "$SERVER_URL/api/v1/repos/$REPO/issues/comments/$existing_id" >/dev/null || fail=1
            else
              curl -fsSL -X POST -H "Authorization: token $GITEA_TOKEN" \
                -H "Content-Type: application/json" -d "$payload" \
                "$comments_url" >/dev/null || fail=1
            fi
            rm -f "$body_file"
            echo "::endgroup::"
          done < "$GITHUB_WORKSPACE/stacks.txt"
          exit $fail

      - name: Remove the staged age key
        if: ${{ always() }}
        run: shred -u /tmp/runner.agekey
