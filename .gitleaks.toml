title = "Gitleaks — homelab public mirror"

# Extend the built-in ruleset rather than replacing it.
# Any rule not overridden here inherits default behaviour.
[extend]
useDefault = true

[allowlist]
  description = "Intentional high-entropy content that is safe to publish"

  regexes = [
    # SOPS-encrypted field values.
    # Format: ENC[AES256_GCM,data:<b64>,iv:<b64>,tag:<b64>,type:<str>]
    # This is ciphertext — the plaintext value is not present anywhere in the repo.
    '''ENC\[AES256_GCM,data:[A-Za-z0-9+/=]+,iv:[A-Za-z0-9+/=]+,tag:[A-Za-z0-9+/=]+,type:\w+\]''',

    # age-encrypted data encryption key stored in SOPS metadata.
    # Appears as a PEM-style block — triggers generic "private key" rules.
    # This is ciphertext encrypted to the age recipient; the actual DEK is not exposed.
    '''-----BEGIN AGE ENCRYPTED FILE-----[\s\S]+?-----END AGE ENCRYPTED FILE-----''',

    # Bind-all listen addresses (e.g. Garage rpc/s3/admin bind_addr).
    # Carries no topology information; not an endpoint disclosure.
    '''\b0\.0\.0\.0(:\d{1,5})?\b''',

    # IPv4 loopback (e.g. PVE exporter smoke-test URL). Local-only address;
    # carries no topology information and is not an endpoint disclosure.
    '''\b127\.0\.0\.1(:\d{1,5})?\b''',

    # RFC 5737 documentation addresses (TEST-NET-1/2/3). Reserved for
    # examples in docs and comments; publishing them is their purpose.
    '''\b(192\.0\.2\.\d{1,3}|198\.51\.100\.\d{1,3}|203\.0\.113\.\d{1,3})\b''',
  ]

  paths = [
    # .sops.yaml contains only age *public* key recipients — analogous to a GPG public key.
    # There is no secret material here; publishing it is intentional and harmless.
    '''\.sops\.yaml''',
  ]

# Rule 1: Block Private IPs (Internal Topology)
# These reveal your internal network structure and should never be public.
[[rules]]
id = "private-ip"
description = "Detect private IP addresses (RFC 1918) in Terraform and YAML config files"
regex = '''\b(10\.\d{1,3}\.\d{1,3}\.\d{1,3}|172\.(1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3})\b'''
path = '''\.(tf|hcl|tfvars|yml|yaml|py)$'''
tags = ["infrastructure", "network", "privacy"]
severity = "high"

  [rules.allowlist]
    description = "IP addresses in markdown are documentation examples, not live config"
    paths = [
      '''\.md$''',
      '''^kubernetes/infrastructure/private/''',
      '''^infrastructure/catalogs/private/''',
      '''^infrastructure/stacks/private/''',
      '''^infrastructure/units/private/''',
      # Pre-RFC-5737 test fixture: the talosconfig endpoint used a fake RFC
      # 1918 address before the neutralization sweep (kept deliberately
      # literal-free here so this file stays scannable under any path
      # filter). The file now uses RFC 5737 addresses, but the historical
      # commits still hold the old fixture. This is allowlisted by PATH, not
      # by commit: the mirror workflow rewrites every SHA with
      # git-filter-repo, so a commits= allowlist never matches on the
      # filtered history.
      '''^tests/test_restore_machine_secrets\.py$''',
    ]
    # ^ paths: export-ignored private trees carry real topology BY DESIGN
    #   (ADR-021) and never reach the public mirror.

# Rule 2: Block Public IPs (External Exposure)
# These reveal external endpoints, potentially exposing attack surfaces.
# Note: Go's RE2 engine does not support lookaheads, so this regex matches all
# IPv4 addresses including RFC 1918 ranges. Private addresses will double-trigger
# with Rule 1 — this is acceptable; Rule 1's "high" severity is the signal to triage on.
[[rules]]
id = "public-ip"
description = "Detect public IP addresses in Terraform and YAML config files"
regex = '''\b(?:(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\b'''
path = '''\.(tf|hcl|tfvars|yml|yaml|py)$'''
tags = ["infrastructure", "network", "exposure"]
severity = "medium"

  [rules.allowlist]
    description = "IP addresses in markdown are documentation examples, not live config"
    paths = [
      '''\.md$''',
      '''^kubernetes/infrastructure/private/''',
      '''^infrastructure/catalogs/private/''',
      '''^infrastructure/stacks/private/''',
      '''^infrastructure/units/private/''',
      # Pre-RFC-5737 test fixture (see private-ip rule above): path-scoped,
      # not commit-scoped, because filter-repo invalidates commit SHAs.
      '''^tests/test_restore_machine_secrets\.py$''',
    ]
    # ^ Same historic fixture exempted as under Rule 1; the public-ip rule
    #   double-triggers on any IPv4, so both need the commit scope.
# Rule 3: Talos cluster credentials tripwire (SEC-02). A committed talosconfig
# grants full Talos API access regardless of its content, so the file name
# alone is the signal.
[[rules]]
id = "talosconfig-file"
description = "Talos config file (talosconfig) committed to git"
path = '''(^|/)talosconfig(\..*)?$'''
tags = ["talos", "kubernetes", "credentials"]
severity = "critical"

# Rule 4: Base64 credential blobs in kubeconfig-style YAML. Catches renamed
# or dated copies (e.g. talos-cluster-01-<date>.yaml) that the path rule
# misses. gitleaks uses Go RE2: no lookaheads; (?m) enables per-line matching.
[[rules]]
id = "talos-kubeconfig-keydata"
description = "Base64 CA/cert/key material in kubeconfig-style YAML"
regex = '''(?m)^\s*(ca|crt|key|certificate-authority-data|client-certificate-data|client-key-data):\s*["']?[A-Za-z0-9+/]{60,}={0,2}["']?\s*$'''
path = '''\.(ya?ml|json)$'''
tags = ["talos", "kubernetes", "kubeconfig", "credentials"]
severity = "critical"

# Rule 5: Talos machine secrets.yaml structural markers. The embedded PEM and
# base64 values fall under default gitleaks rules; these markers catch the
# file even with unusual value formatting. The SOPS-encrypted OpenTofu vars
# file (infrastructure/secrets.yaml) carries none of these markers; the
# allowlist below documents that intent explicitly.
[[rules]]
id = "talos-machine-secrets-yaml"
description = "Talos machine secrets.yaml structure"
regex = '''(?m)^trustdinfo:|^\s{0,4}(bootstraptoken|clusterSecret|machinesecret):\s*\S+'''
path = '''secrets\.ya?ml$'''
tags = ["talos", "kubernetes", "secrets"]
severity = "critical"

  [rules.allowlist]
    description = "SOPS-encrypted values are ciphertext, not plaintext secrets"
    regexes = [
      '''ENC\[AES256_GCM,data:''',
    ]
