---
# verify.yaml — read-only checks used in CI. Never makes changes.
# Mirrors bootstrap.yaml but forces --check mode at the play level.

- name: Verify Proxmox host desired state (read-only)
  hosts: proxmox
  gather_facts: true
  check_mode: true

  roles:
    - role: proxmox_base
      tags: [proxmox_base]
    - role: fan_control
      tags: [fan_control]
