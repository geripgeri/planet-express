---
# build-essential + the headers matching the *running* kernel.
# This task list re-runs on every kernel upgrade because
# linux-headers-$(uname -r) is version-specific.

- name: Install kernel headers for running kernel
  ansible.builtin.apt:
    name:
      - build-essential
      - "proxmox-headers-{{ ansible_facts['kernel'] }}"
      - dkms
      - dh-dkms
      - git
    state: present
    update_cache: true
    lock_timeout: 300
  # Same as apt_upgrade.yaml: apt performs a live `apt update` even in check
  # mode; skip it so verify.yaml stays side-effect free.
  when: not ansible_check_mode
  tags: [build-deps]
