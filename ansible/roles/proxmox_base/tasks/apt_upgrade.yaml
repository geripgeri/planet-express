---
# Applies pending Proxmox upgrades with apt dist-upgrade — the upgrade path
# PVE itself recommends; there is no separate pveupgrade wrapper.
#
# autoremove is intentionally NOT used: on PVE it can remove old kernels and
# their DKMS-built modules (e.g. nct6687d) depending on package auto-marking.
# Old-kernel cleanup is left as a deliberate, manual decision.
#
# Idempotency: ansible.builtin.apt reports changed=true only when packages
# were actually upgraded. Reboot decision lives in reboot.yaml and checks the
# installed package set, not this task's output text.

- name: Refresh apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 0  # always refresh — we're about to upgrade
    lock_timeout: 300
  # apt still performs a live `apt update` in check mode; skip it so
  # verify.yaml (read-only CI) has no side effects at all.
  when: not ansible_check_mode

- name: Upgrade all packages (dist-upgrade)
  ansible.builtin.apt:
    upgrade: dist
    autoclean: true
    lock_timeout: 300
