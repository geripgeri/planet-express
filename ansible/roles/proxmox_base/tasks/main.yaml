---
- name: Upgrade Proxmox packages
  ansible.builtin.import_tasks: apt_upgrade.yaml
  tags: [proxmox_base, upgrade]

- name: Reboot if new kernel was installed
  ansible.builtin.import_tasks: reboot.yaml
  tags: [proxmox_base, reboot]

- name: Ensure Debian LXC base image is present
  ansible.builtin.import_tasks: pveam.yaml
  tags: [proxmox_base, pveam]

- name: Ensure Talos ISO present (versioned)
  ansible.builtin.get_url:
    url: "https://github.com/siderolabs/talos/releases/download/{{ proxmox_base_talos_iso_version }}/metal-amd64.iso"
    dest: "/var/lib/vz/template/iso/talos-{{ proxmox_base_talos_iso_version }}-nocloud-amd64.iso"
    mode: "0644"
  tags: [talos_iso]

- name: Prune old Talos ISOs (keep 5 most recent)
  ansible.builtin.shell:
    cmd: set -o pipefail; ls -1t /var/lib/vz/template/iso/talos-*.iso 2>/dev/null | tail -n +6 | xargs -r rm -v
    executable: /bin/bash
  register: proxmox_base_talos_iso_prune
  changed_when: proxmox_base_talos_iso_prune.stdout != ""
  tags: [talos_iso]
