---
# Reboots the host if a kernel package was upgraded, then re-gathers facts.
#
# Detection: checks whether 'proxmox-kernel' appears in the apt upgrade
# output registered in apt_upgrade.yml. No shell commands or dpkg parsing
# needed — the information is already in the apt task's return value.
#
# After the reboot, gather_facts is called so that ansible_kernel reflects
# the new kernel for all subsequent roles. Without this the fan_control role
# would see the pre-reboot kernel version and skip the nct6687d rebuild.

- name: Determine if a kernel package was upgraded
  ansible.builtin.set_fact:
    proxmox_base_needs_reboot: "{{ 'proxmox-kernel' in proxmox_base_apt_upgrade.stdout }}"

- name: Reboot host to apply new kernel
  ansible.builtin.reboot:
    pre_reboot_delay: "{{ proxmox_base_reboot_pre_delay }}"
    reboot_timeout: "{{ proxmox_base_reboot_timeout }}"
    test_command: uname -r
  when: proxmox_base_needs_reboot

- name: Re-gather facts after reboot
  ansible.builtin.gather_facts:
  when: proxmox_base_needs_reboot
