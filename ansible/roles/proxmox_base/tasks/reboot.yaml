---
# Reboots the host if a newer PVE kernel than the running one is installed,
# then re-gathers facts so downstream roles see the new kernel.
#
# Detection uses the installed package set (package_facts), not apt output
# text: it is language-independent and cannot false-positive on
# "will be REMOVED" lines. Every installed proxmox-kernel-*/pve-kernel-*
# version is compared against the running kernel (ansible_facts['kernel']).

- name: Gather installed packages after upgrade
  ansible.builtin.package_facts:
    manager: apt

- name: List installed PVE kernel packages
  ansible.builtin.set_fact:
    proxmox_base_kernel_pkgs: >-
      {{
        ansible_facts.packages
        | list
        | select('match', '^(proxmox-|pve-)kernel-[0-9]')
        | list
      }}

- name: Determine if a newer kernel than the running one is installed
  ansible.builtin.set_fact:
    proxmox_base_needs_reboot: >-
      {{
        proxmox_base_kernel_pkgs
        | reject('search', ansible_facts['kernel'])
        | map('regex_replace', '^(proxmox-|pve-)kernel-', '')
        | select('version', ansible_facts['kernel'], '>')
        | list | length > 0
      }}

- name: Reboot host to apply new kernel
  ansible.builtin.reboot:
    pre_reboot_delay: "{{ proxmox_base_reboot_pre_delay }}"
    reboot_timeout: "{{ proxmox_base_reboot_timeout }}"
    test_command: uname -r
  when: proxmox_base_needs_reboot

- name: Re-gather facts after reboot
  ansible.builtin.gather_facts:
  when: proxmox_base_needs_reboot
