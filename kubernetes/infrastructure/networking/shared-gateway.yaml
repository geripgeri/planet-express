# Shared Gateway — one wildcard gateway for every current and future
# subdomain. Per-app hostnames stay out of listener config entirely.
# allowedRoutes from All lets routes attach from any namespace, but HTTPRoutes
# still live in kube-system: Cilium does not reconcile cross-namespace routes
# (cilium/cilium#39057, see ADR-005). A cross-namespace backendRef still needs
# a ReferenceGrant in the backend namespace.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: shared-gateway
  namespace: kube-system
  annotations:
    argocd.argoproj.io/compare-options: IgnoreExtraneous
spec:
  gatewayClassName: cilium
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      hostname: "*.peidl.net"
      allowedRoutes:
        kinds:
          - group: gateway.networking.k8s.io
            kind: HTTPRoute
        namespaces:
          from: All
    - name: https
      port: 443
      protocol: HTTPS
      hostname: "*.peidl.net"
      tls:
        mode: Terminate
        certificateRefs:
          - name: wildcard-tls
      allowedRoutes:
        kinds:
          - group: gateway.networking.k8s.io
            kind: HTTPRoute
        namespaces:
          from: All
