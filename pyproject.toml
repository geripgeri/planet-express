[project]
name = "planet-express"
version = "0.1.0"
description = "A production-grade homelab running Talos + K8s + ArgoCD, documented with ADRs. Delivering workloads since 2025."
readme = "README.md"
requires-python = ">=3.14"

dependencies = [
    "ansible-lint>=25",
    "pre-commit>=4.5.1",
    "pytest>=9.0.3",
    "pytest-cov>=7.1",
    "pyyaml>=6",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--cov=scripts --cov-report=term-missing --cov-branch"

[tool.coverage.run]
branch = true
source = ["scripts"]

[tool.coverage.report]
show_missing = true
